spring:
  application:
    name: jobscout
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobscout?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jobscout:
  search:
    # Calendar-month lookback for job postings; 0 means jobs posted today only.
    posted-within-months: ${JOBSCOUT_SEARCH_POSTED_WITHIN_MONTHS:1}
  google:
    sheets:
      credentials-file: ${GOOGLE_SERVICE_ACCOUNT_FILE:}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
